
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Rotas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#142b4a;color:white;padding:22px 18px}
header h1{margin:0;font-size:24px}
header p{margin:8px 0 0;color:#dbeafe;font-size:14px}
main{max-width:650px;margin:auto;padding:16px}
.card{background:white;padding:18px;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 12px #0000000d}
h2{font-size:18px;margin:0 0 16px}
label{display:block;font-size:14px;font-weight:bold;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:#fff;color:#172033}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:14px}
.primary{background:#1769e0;color:white}
.secondary{background:#e5edf8;color:#17365d}
button:disabled{opacity:.6}
.note{font-size:12px;color:#64748b;line-height:1.5}
.result{background:#edf6ff;border-radius:12px;padding:14px;margin-top:12px}
.result p{display:flex;justify-content:space-between;gap:12px;margin:10px 0}
.result strong{ text-align:right}
.total{font-size:21px;color:#0755b8;font-weight:bold}
.status{font-size:13px;line-height:1.5;margin-top:10px;color:#475569}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>Calculadora de Rotas</h1>
<p>Calcule os custos e quanto cobrar pela viagem.</p>
</header>
<main>
<section class="card">
<h2>📍 Origem e destino</h2>
<label for="origem">Endereço de origem</label>
<input id="origem" placeholder="Ex.: Centro, Nova Odessa, SP">
<label for="destino">Endereço de destino</label>
<input id="destino" placeholder="Ex.: Centro, Campinas, SP">
<button class="primary" id="btnRota" onclick="buscarRota()">Buscar distância automaticamente</button>
<p class="note">Informe endereços completos, com cidade e estado, para melhorar a busca.</p>
<div id="statusRota" class="status">A distância ainda não foi calculada.</div>
</section>

<section class="card">
<h2>🚗 Veículo e despesas</h2>
<label for="distancia">Distância da viagem (km)</label>
<input id="distancia" type="number" min="0" step="0.1" value="0">

<div class="grid">
<div>
<label for="consumo">Consumo (km/l)</label>
<input id="consumo" type="number" min="0.1" step="0.1" value="10">
</div>
<div>
<label for="combustivel">Combustível (R$/l)</label>
<input id="combustivel" type="number" min="0" step="0.01" value="6">
</div>
</div>

<div class="grid">
<div>
<label for="pedagios">Pedágios (R$)</label>
<input id="pedagios" type="number" min="0" step="0.01" value="0">
</div>
<div>
<label for="extras">Outras despesas (R$)</label>
<input id="extras" type="number" min="0" step="0.01" value="0">
</div>
</div>

<label for="percentual">Ganho desejado (%)</label>
<input id="percentual" type="number" min="0" step="1" value="30">
<button class="primary" id="btnCalcular" onclick="calcular()">Calcular valor da viagem</button>
</section>
</main>
</body>
</html>

<script>
function numero(id) {
  const valor = Number(document.getElementById(id).value);
  return Number.isFinite(valor) && valor >= 0 ? valor : 0;
}

function moeda(valor) {
  return valor.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function calcular() {
  const distancia = numero("distancia");
  const consumo = numero("consumo");
  const precoCombustivel = numero("combustivel");
  const pedagios = numero("pedagios");
  const extras = numero("extras");
  const percentual = numero("percentual");

  if (consumo <= 0) {
    alert("Informe um consumo válido em km/l.");
    return;
  }

  const litros = distancia / consumo;
  const custoCombustivel = litros * precoCombustivel;
  const custos = custoCombustivel + pedagios + extras;
  const ganho = custos * percentual / 100;
  const total = custos + ganho;

  let resultados = document.getElementById("resultados");

  if (!resultados) {
    resultados = document.createElement("section");
    resultados.id = "resultados";
    resultados.className = "card";
    document.querySelector("main").appendChild(resultados);
  }

  resultados.innerHTML = `
    <h2>📊 Resultado da viagem</h2>
    <div class="result">
      <p><span>Distância</span><strong>${distancia.toLocaleString("pt-BR")} km</strong></p>
      <p><span>Combustível estimado</span><strong>${moeda(custoCombustivel)}</strong></p>
      <p><span>Pedágios</span><strong>${moeda(pedagios)}</strong></p>
      <p><span>Outras despesas</span><strong>${moeda(extras)}</strong></p>
      <p><span>Custo total</span><strong>${moeda(custos)}</strong></p>
      <p><span>Ganho (${percentual}%)</span><strong>${moeda(ganho)}</strong></p>
      <p class="total"><span>Valor sugerido</span><strong>${moeda(total)}</strong></p>
    </div>
    <p class="note">Estimativa baseada nos valores informados. Pedágios e outros custos devem ser conferidos.</p>
  `;

  resultados.scrollIntoView({ behavior: "smooth", block: "start" });
}

["distancia", "consumo", "combustivel", "pedagios", "extras", "percentual"]
  .forEach(id => {
    document.getElementById(id).addEventListener("input", () => {
      const resultados = document.getElementById("resultados");
      if (resultados) resultados.remove();
    });
  });
</script>
</body>
</html>

<script>
async function buscarRota() {
  const origem = document.getElementById("origem").value.trim();
  const destino = document.getElementById("destino").value.trim();
  const status = document.getElementById("statusRota");
  const botao = document.getElementById("btnRota");

  if (!origem || !destino) {
    alert("Informe o endereço de origem e o destino.");
    return;
  }

  botao.disabled = true;
  botao.textContent = "Buscando rota...";
  status.textContent = "Localizando os endereços...";

  try {
    async function localizar(endereco) {
      const url =
        "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=" +
        encodeURIComponent(endereco + ", Brasil");

      const resposta = await fetch(url);

      if (!resposta.ok) {
        throw new Error("O serviço de endereços está indisponível. Tente novamente.");
      }

      const dados = await resposta.json();

      if (!dados.length) {
        throw new Error("Endereço não encontrado: " + endereco);
      }

      return {
        lat: Number(dados[0].lat),
        lon: Number(dados[0].lon)
      };
    }

    const pontoA = await localizar(origem);

    status.textContent = "Localizando o destino...";
    await new Promise(resolve => setTimeout(resolve, 1100));

    const pontoB = await localizar(destino);

    status.textContent = "Calculando a distância da viagem...";

    const urlRota =
      "https://router.project-osrm.org/route/v1/driving/" +
      pontoA.lon + "," + pontoA.lat + ";" +
      pontoB.lon + "," + pontoB.lat +
      "?overview=false";

    const respostaRota = await fetch(urlRota);

    if (!respostaRota.ok) {
      throw new Error("Não foi possível consultar o serviço de rotas.");
    }

    const dadosRota = await respostaRota.json();

    if (dadosRota.code !== "Ok" || !dadosRota.routes.length) {
      throw new Error("Não foi encontrada uma rota para esses endereços.");
    }

    const km = dadosRota.routes[0].distance / 1000;

    document.getElementById("distancia").value = km.toFixed(1);

    calcular();

    status.textContent =
      "Rota encontrada! Distância aproximada: " +
      km.toLocaleString("pt-BR", { maximumFractionDigits: 1 }) +
      " km. Confira se os endereços estão corretos.";

  } catch (erro) {
    status.textContent = erro.message;
    alert(erro.message);
  } finally {
    botao.disabled = false;
    botao.textContent = "Buscar distância automaticamente";
  }
}
</script>

</body>
</html>
